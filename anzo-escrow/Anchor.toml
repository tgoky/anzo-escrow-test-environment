[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
anzo_escrow = "6swJPHnA6dJXUbtu2D2vTwqZVr1RzHe1k1mbDCqbwL3X"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "0.0.0.0"
ledger = ".anchor/test-ledger"
rpc_port = 8899